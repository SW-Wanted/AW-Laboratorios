<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>SW-Wanted</title>
    <link rel="stylesheet" href="content/css/styles.css" />
  </head>
  <body>
    <h1 id="title">Formulário</h1>
    <p id="description">Preenche rápido cassule!</p>

    <form id="sw-form" action="/" method="POST">
      <div style="text-align: center; margin: 20px 0">
        <img src="content/imgs/sw_wanted.png" alt="SW Wanted" width="64px" />
        <figcaption><em>SW Wanted</em></figcaption>
      </div>

      <fieldset>
        <div class="form-control">
          <label id="name-label" for="name">
            Nome Completo
            <input
              id="name"
              name="t_nome"
              type="text"
              placeholder="Insira seu nome completo"
              required
            />
          </label>
        </div>

        <div class="form-control">
          <label for="d_nascimento">
            Data de Nascimento
            <input type="date" name="d_nascimento" id="d_nascimento" required />
          </label>
        </div>

        <div>
          <p>Gênero</p>
          <label class="radio-label">
            <input name="rb_genero" type="radio" value="Masculino" checked />
            Masculino
          </label>
          <label class="radio-label">
            <input name="rb_genero" type="radio" value="Feminino" /> Feminino
          </label>
        </div>
      </fieldset>

      <fieldset>
        <div>
          <p>Estado Civil</p>
          <label class="radio-label">
            <input name="rbo_estado_civil" type="radio" value="Solteiro" />
            Solteiro/a
          </label>
          <label class="radio-label">
            <input name="rbo_estado_civil" type="radio" value="Casado" />
            Casado/a
          </label>
          <label class="radio-label">
            <input name="rbo_estado_civil" type="radio" value="Viuvo" /> Viúvo/a
          </label>
          <label class="radio-label">
            <input name="rbo_estado_civil" type="radio" value="complicado" /> É
            complicado
          </label>
        </div>

        <div>
          <p>Linguagens de Programação Favoritas</p>
          <label class="checkbox-label">
            <input type="checkbox" name="cbo_csharp" value="C#" /> C#
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="cbo_php" value="PHP" /> PHP
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="cbo_java" value="Java" /> Java
          </label>
        </div>

        <div class="form-control">
          <p>Nacionalidade</p>
          <select id="dropdown" name="s_nacionalidade">
            <option selected disabled value="">
              Selecione a nacionalidade
            </option>
            <option value="angola">Angolana</option>
            <option value="portugal">Português</option>
            <option value="brasil">Brasileiro</option>
            <option value="franca">Francês</option>
          </select>
        </div>

        <div class="form-control">
          <p>Idioma</p>
          <div class="row">
            <label class="checkbox-label">
              <input type="checkbox" name="cbo_idioma" value="English_US" />
              Inglês
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="cbo_idioma" value="Lingala_AO" />
              Lingala
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="cbo_idioma" value="French_FR" />
              Francês
            </label>
            <label class="checkbox-label">
              <input
                type="checkbox"
                name="cbo_idioma"
                value="Portuguese_AO"
              />
              Português (Angola)
            </label>
          </div>
        </div>

        <div>
          <p>Morada</p>
          <textarea
            id="ta_morada"
            name="ta_morada"
            rows="3"
            placeholder="Insira a sua morada completa..."
          ></textarea>
        </div>
      </fieldset>

      <input id="submit" type="submit" value="Submeter" />
    </form>
  </body>
</html>
