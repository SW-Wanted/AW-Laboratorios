<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Tabela de cargos</title>
</head>
<body>
    <table align="center" border="2px">
        <thead style="background-color: black; color: white;">
            <tr>
                <th>Cargo</th>
                <th>Especialista</th>
                <th>Salario</th>
                <th>Free</th>
            </tr>
        </thead>
        <tbody>
            <tr style="background-color: beige;">
                <td style="color: blue;">Web Developer</td>
                <td align="center">-</td>
                <td>5.700</td>
                <td align="center">-</td>
            </tr>
            <tr>
                <td style="color: blue;">Database Administrator</td>
                <td align="center">-</td>
                <td>5.000</td>
                <td align="center">-</td>
            </tr>
            <tr style="background-color: beige;">
                <td rowspan="2" style="color: blue;">Web Designer</td>
                <td>Desenho de Layouts</td>
                <td>3.900</td>
                <td>4.200</td>
            </tr>
            <tr>
                <td>HTML / CSS / Booststrap</td>
                <td>3.440</td>
                <td>3.950</td>
            </tr>
            <tr style="background-color: beige;">
                <td style="color: blue;">Consultor Especialista</td>
                <td align="center">-</td>
                <td>3.500</td>
                <td>4.000</td>
            </tr>
            <tr>
                <td style="color: blue;">Analista de Negócio</td>
                <td align="center">-</td>
                <td>2.700</td>
                <td>3.600</td>
            </tr>
            <tr style="background-color: beige;">
                <td style="color: blue;">Analista de Sistemas</td>
                <td align="center">-</td>
                <td>2.270</td>
                <td>3.000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
